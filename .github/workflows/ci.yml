name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Lint governed backend surfaces
        run: >-
          ruff check
          api/index.py
          src/lefa/bridge_api.py
          src/lefa/featherless.py
          src/lefa/web_api.py
          tests/test_bridge_api.py
          tests/test_featherless.py
          scripts/search_featherless_models.py
          scripts/test_featherless.py
          scripts/test_featherless_chat.py
          scripts/test_featherless_models.py
          scripts/test_featherless_models_eval.py
      - name: Full backend regression suite
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: Typecheck current root frontend
        run: npx tsc --noEmit --noUnusedLocals false --noUnusedParameters false
      - run: npm run build
