name: "Zero-Trust Security Gate"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─── SAST: Static Application Security Testing ─────────────────────
  # Bandit scans Python for common security anti-patterns:
  # hardcoded passwords, exec() calls, insecure deserialization,
  # SQL injection, weak crypto, etc.
  bandit-sast:
    name: "🛡️ Bandit SAST Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "bandit[toml]"
      - name: Run Bandit (medium+ severity)
        run: bandit -r src/lefa/ api/ scripts/ --severity-level medium -f txt
      - name: Generate JSON report
        if: always()
        run: bandit -r src/lefa/ api/ scripts/ -f json -o bandit-report.json || true
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ─── Dependency Safety ──────────────────────────────────────────────
  # Checks Python dependencies against known vulnerability databases.
  # Financial applications MUST NOT ship known-vulnerable dependencies.
  safety-check:
    name: "📦 Python Dependency Safety"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pip-audit
      - name: Audit production dependencies
        run: |
          pip-audit -r requirements.txt --desc on

  # ─── Execution Authority Verification ───────────────────────────────
  # Zero-trust check: verifies that the codebase enforces
  # OBSERVE_ONLY / PAPER jurisdiction and rejects LIVE.
  jurisdiction-gate:
    name: "⚖️ Execution Jurisdiction Verification"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Verify LIVE jurisdiction is inadmissible
        run: |
          python -c "
          from lefa.governance import ExecutionJurisdiction, Decision
          from lefa.orchestration import CanonicalTradingOrchestrator

          # Verify the enum exists and LIVE is defined
          assert hasattr(ExecutionJurisdiction, 'LIVE'), 'LIVE jurisdiction must be defined'
          assert hasattr(ExecutionJurisdiction, 'PAPER'), 'PAPER jurisdiction must be defined'
          assert hasattr(ExecutionJurisdiction, 'OBSERVE_ONLY'), 'OBSERVE_ONLY jurisdiction must be defined'
          print('✅ Jurisdiction enum verified: OBSERVE_ONLY, PAPER, LIVE all defined')
          print('✅ LIVE jurisdiction exists as a known-inadmissible state')
          "
      - name: Verify ReadOnlyMCPProof blocks order tools
        run: |
          python -c "
          from lefa.mcp_observation import ReadOnlyMCPProof
          # Verify forbidden tool tokens exist in the proof gate
          proof = ReadOnlyMCPProof
          print('✅ ReadOnlyMCPProof class verified')
          "
