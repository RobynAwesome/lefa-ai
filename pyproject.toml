[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lefa-ai"
version = "0.1.0"
description = "LEFA AI — Alpaca AI Trading Agents Hackathon POC"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aiohttp>=3.12,<4",
  "alpaca-py>=0.42,<1",
  "fastapi>=0.116,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
  "uvicorn>=0.30,<1",
]
mcp = [
  "alpaca-mcp-server==2.2.0",
  "fastmcp>=3.1,<4",
]

[project.scripts]
lefa = "lefa.cli:app"
lefa-ui = "lefa.demo_server:main"
lefa-mcp-proof = "lefa.mcp_v2:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lefa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.vercel]
entrypoint = "vercel_app:app"
