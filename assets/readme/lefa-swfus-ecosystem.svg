<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LEFA SWFUS ecosystem map</title>
  <desc id="desc">Animated map showing LEFA in the center with five bounded SWFUS agent ecosystems.</desc>
  <defs>
    <linearGradient id="gold" x1="100" y1="160" x2="1100" y2="160"><stop stop-color="#FFF1A6"/><stop offset="0.5" stop-color="#D0A133"/><stop offset="1" stop-color="#FFF0A0"/></linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="320" rx="26" fill="#090908"/>
  <rect x="18" y="18" width="1164" height="284" rx="20" fill="none" stroke="#D2A43A" stroke-opacity="0.22"/>
  <g stroke="#40391F" stroke-width="2" fill="none">
    <path d="M600 160L170 75"/><path d="M600 160L170 245"/><path d="M600 160L395 260"/><path d="M600 160L805 260"/><path d="M600 160L1030 160"/>
  </g>
  <g fill="#11100C" stroke="#53461E">
    <rect x="490" y="112" width="220" height="96" rx="22"/>
    <rect x="78" y="44" width="185" height="64" rx="18"/>
    <rect x="78" y="212" width="185" height="64" rx="18"/>
    <rect x="305" y="228" width="180" height="64" rx="18"/>
    <rect x="715" y="228" width="180" height="64" rx="18"/>
    <rect x="932" y="128" width="190" height="64" rx="18"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="150" fill="#F7F4EA" font-size="24" font-weight="900">LEFA</text>
    <text x="600" y="177" fill="#F0D26B" font-size="12" font-weight="800" letter-spacing="2">BASE IDENTITY</text>
    <text x="600" y="195" fill="#8F8878" font-size="11">the only intelligence that talks to the user</text>

    <text x="170" y="71" fill="#F0D26B" font-size="22" font-weight="900">S</text><text x="170" y="93" fill="#A9A18E" font-size="11">Sovereign Ingestion</text>
    <text x="170" y="239" fill="#F0D26B" font-size="22" font-weight="900">W</text><text x="170" y="261" fill="#A9A18E" font-size="11">Witness Isolation</text>
    <text x="395" y="255" fill="#F0D26B" font-size="22" font-weight="900">F</text><text x="395" y="277" fill="#A9A18E" font-size="11">Fluid Vectoring</text>
    <text x="805" y="255" fill="#F0D26B" font-size="22" font-weight="900">U</text><text x="805" y="277" fill="#A9A18E" font-size="11">Unified Synchronization</text>
    <text x="1027" y="155" fill="#F0D26B" font-size="22" font-weight="900">S</text><text x="1027" y="177" fill="#A9A18E" font-size="11">Severance Execution</text>
  </g>
  <circle cx="600" cy="160" r="10" fill="#F0D26B" opacity="0.7"><animate attributeName="r" values="8;15;8" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0.25;0.9" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle r="5" fill="#FFF1A6" filter="url(#soft)"><animateMotion dur="6.5s" repeatCount="indefinite" path="M600 160L170 75L600 160L1030 160L600 160L805 260L600 160"/></circle>
  <circle r="4" fill="#D0A133" filter="url(#soft)"><animateMotion dur="7.8s" begin="-2s" repeatCount="indefinite" path="M600 160L170 245L600 160L395 260L600 160L1030 160L600 160"/></circle>
  <text x="600" y="44" text-anchor="middle" fill="#F6F2E8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" letter-spacing="3">FIVE AGENTS · FIVE BOUNDED ECOSYSTEMS · ONE LEFA</text>
</svg>