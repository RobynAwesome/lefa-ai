<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Meet LEFA — governed financial intelligence companion</title>
  <desc id="desc">Animated black, gold and white LEFA hero with a living companion, signal routes, and Observe Ledger Reveal states.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050505"/>
      <stop offset="0.45" stop-color="#11100B"/>
      <stop offset="0.75" stop-color="#18140A"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <linearGradient id="gold" x1="120" y1="210" x2="1080" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF1A6"/><stop offset="0.25" stop-color="#F6D365"/><stop offset="0.55" stop-color="#C99B2E"/><stop offset="1" stop-color="#FFF0A0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 205) rotate(90) scale(180)">
      <stop stop-color="#D6A53A" stop-opacity="0.26"/><stop offset="1" stop-color="#D6A53A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="384" rx="24" stroke="url(#gold)" stroke-opacity="0.28"/>
  <g opacity="0.14" stroke="#FFFFFF">
    <path d="M60 95H1140"/><path d="M60 325H1140"/><path d="M475 45V375"/><path d="M1010 45V375"/>
  </g>
  <circle cx="300" cy="205" r="178" fill="url(#halo)"><animate attributeName="r" values="164;184;164" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="205" r="145" fill="#000" stroke="url(#gold)" stroke-width="3" stroke-opacity="0.75"><animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="3.8s" repeatCount="indefinite"/></circle>
  <g transform="translate(205 73)">
    <path d="M48 62C64 20 151 13 182 54C151 40 86 43 48 62Z" fill="#080808" stroke="#F2D16B" stroke-width="3"/>
    <ellipse cx="115" cy="92" rx="52" ry="56" fill="#B86A2A"/>
    <path d="M91 93C103 99 126 99 139 93" stroke="#141414" stroke-width="3" stroke-linecap="round"/>
    <circle cx="97" cy="80" r="4" fill="#101010"/><circle cx="133" cy="80" r="4" fill="#101010"/>
    <path d="M76 140H154L185 264H45L76 140Z" fill="#0A0A0A" stroke="#F2D16B" stroke-width="3"/>
    <path d="M83 143L116 171L149 143" stroke="#F2D16B" stroke-width="4"/>
    <path d="M58 232L88 198L116 226L143 198L173 232" stroke="#C99B2E" stroke-width="5" fill="none"/>
    <path d="M48 175L24 245M182 175L206 245" stroke="#0A0A0A" stroke-width="24" stroke-linecap="round"/>
    <path d="M48 175L24 245M182 175L206 245" stroke="#D1A33E" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="530" y="125" fill="#F7F5EF" font-size="48" font-weight="900" letter-spacing="3">MEET LEFA</text>
    <text x="532" y="165" fill="#F2D16B" font-size="20" font-weight="700" letter-spacing="2">FINANCIAL INTELLIGENCE THROUGH AI</text>
    <text x="532" y="194" fill="#C9C4B7" font-size="16" font-weight="600" letter-spacing="2">POWERED BY SPIRITUAL INTELLIGENCE</text>
    <text x="532" y="245" fill="#F4F1E7" font-size="18" font-weight="700">Your companion for governed financial insight.</text>
    <g font-size="13" font-weight="800" letter-spacing="2">
      <rect x="530" y="278" width="154" height="42" rx="21" fill="#15130D" stroke="#F2D16B"/>
      <text x="607" y="304" text-anchor="middle" fill="#F2D16B">OBSERVE</text>
      <rect x="700" y="278" width="154" height="42" rx="21" fill="#15130D" stroke="#F2D16B"/>
      <text x="777" y="304" text-anchor="middle" fill="#F2D16B">LEDGER</text>
      <rect x="870" y="278" width="154" height="42" rx="21" fill="#15130D" stroke="#F2D16B"/>
      <text x="947" y="304" text-anchor="middle" fill="#F2D16B">REVEAL</text>
    </g>
  </g>
  <path id="route" d="M600 355C690 330 742 382 825 348C902 316 983 365 1100 330" stroke="url(#gold)" stroke-width="2.5" stroke-dasharray="10 14" opacity="0.7"><animate attributeName="stroke-dashoffset" values="0;-96" dur="4.5s" repeatCount="indefinite"/></path>
  <circle r="6" fill="#FFF1A6" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M600 355C690 330 742 382 825 348C902 316 983 365 1100 330"/></circle>
  <text x="1065" y="383" text-anchor="end" fill="#8F8776" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2">HEAVY ARCHITECTURE · LIGHT INTERFACE</text>
</svg>